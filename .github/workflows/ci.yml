name: Verificar matrículas y aplicación
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/matricula-segura-por-curso]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilación TypeScript y Vite
        run: npm run build
